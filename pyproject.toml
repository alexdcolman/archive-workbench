[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-workbench"
version = "0.89.0"
description = "Aplicación local para registro, extracción, edición y anotación de archivos desclasificados."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Alex Colman"},
  {name = "Grupo de Investigación en Archivos de la Represión (GIAR)"},
]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
  "Pillow>=10.2,<13",
  "PyMuPDF>=1.25,<2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=5.2,<6",
]
streamlit = [
  "streamlit>=1.55,<2",
]
extraction = [
  "docling>=2.100,<3",
]
surya = [
  "surya-ocr==0.22.1",
]
audiovisual = [
  "faster-whisper>=1.1,<2",
]
platform = [
  "yt-dlp[default,deno]>=2026.7.4,<2027",
]
discovery = [
  "spacy>=3.8,<4",
]
tiff = [
  "pyvips[binary]>=3,<4",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.20,<2",
]

[project.scripts]
archive-workbench = "archive_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "fast: pruebas unitarias, contratos puros y verificaciones estáticas sin integración persistente",
  "integration: integración local entre componentes, SQLite, archivos, CLI o scripts sin servicios externos en vivo",
  "slow: recorridos materialmente pesados, evaluaciones, intercambio o límites de motores opcionales",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = [
  "src/archive_workbench/contracts",
  "src/archive_workbench/domain",
  "src/archive_workbench/io",
  "src/archive_workbench/temporal.py",
  "src/archive_workbench/version.py",
]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.setuptools.package-data]
archive_workbench = ["migrations/*", "migrations/versions/*.py", "default_config/*.yaml"]
