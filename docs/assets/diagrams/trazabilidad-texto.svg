<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 410" role="img" aria-labelledby="title desc">
<title id="title">Trazabilidad del texto durante el procesamiento y la revisión</title>
<desc id="desc">Un archivo original produce derivados y extracciones de texto. Una persona elige una extracción y esa elección alimenta un texto editable con revisiones.</desc>
<style>text{font-family:Arial,sans-serif;fill:#20211f}.box{fill:#fbf9f3;stroke:#244b5a;stroke-width:2}.decision{fill:#f4f0e6;stroke:#6d2f2f;stroke-width:3}.arr{stroke:#64635d;stroke-width:2.5;fill:none;marker-end:url(#m)}.h{font-size:20px;font-weight:700}.s{font-size:15px}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64635d"/></marker></defs>
<rect class="box" x="25" y="145" width="185" height="95"/><text class="h" x="45" y="180">Archivo original</text><text class="s" x="45" y="210">contenido inmutable</text>
<rect class="box" x="265" y="45" width="205" height="95"/><text class="h" x="285" y="80">Derivado A</text><text class="s" x="285" y="108">imagen preparada</text>
<rect class="box" x="265" y="265" width="205" height="95"/><text class="h" x="285" y="300">Derivado B</text><text class="s" x="285" y="328">otra preparación</text>
<path class="arr" d="M210 180 H235 V92 H258"/><path class="arr" d="M210 205 H235 V312 H258"/>
<rect class="box" x="525" y="45" width="215" height="95"/><text class="h" x="545" y="80">Extracción A</text><text class="s" x="545" y="106">texto pendiente de elección</text>
<rect class="box" x="525" y="265" width="215" height="95"/><text class="h" x="545" y="300">Extracción B</text><text class="s" x="545" y="326">texto pendiente de elección</text>
<path class="arr" d="M470 92 H518"/><path class="arr" d="M470 312 H518"/>
<rect class="decision" x="795" y="145" width="165" height="95"/><text class="h" x="815" y="180">Elección</text><text class="h" x="815" y="204">explícita</text><text class="s" x="815" y="226">por página</text>
<path class="arr" d="M740 92 H765 V175 H788"/><path class="arr" d="M740 312 H765 V210 H788"/>
<rect class="box" x="1015" y="145" width="200" height="95"/><text class="h" x="1035" y="178">Texto editable</text><text class="s" x="1035" y="207">revisiones</text><text class="s" x="1035" y="229">sucesivas</text>
<path class="arr" d="M960 192 H1008"/>
</svg>
