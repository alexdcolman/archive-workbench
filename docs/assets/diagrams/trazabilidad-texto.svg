<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">Capas de texto y trazabilidad</title><desc id="desc">Un original inmutable produce derivados y extracciones candidatas; una selección explícita alimenta una capa editable versionada y luego exportaciones.</desc><style>text{font-family:Arial,sans-serif;fill:#20211f}.box{fill:#fbf9f3;stroke:#244b5a;stroke-width:2}.decision{fill:#f4f0e6;stroke:#6d2f2f;stroke-width:3}.arr{stroke:#64635d;stroke-width:2.5;fill:none;marker-end:url(#m)}.h{font-size:20px;font-weight:700}.s{font-size:15px}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64635d"/></marker></defs><rect class="box" x="30" y="135" width="180" height="90"/><text class="h" x="50" y="170">Original</text><text class="s" x="50" y="197">inmutable + SHA-256</text><rect class="box" x="270" y="55" width="190" height="90"/><text class="h" x="290" y="90">Derivado A</text><text class="s" x="290" y="117">preparación versionada</text><rect class="box" x="270" y="245" width="190" height="90"/><text class="h" x="290" y="280">Derivado B</text><text class="s" x="290" y="307">otra preparación</text><path class="arr" d="M210 170 H240 V100 H263"/><path class="arr" d="M210 190 H240 V290 H263"/><rect class="box" x="520" y="55" width="190" height="90"/><text class="h" x="540" y="90">Extracción A</text><text class="s" x="540" y="117">candidata</text><rect class="box" x="520" y="245" width="190" height="90"/><text class="h" x="540" y="280">Extracción B</text><text class="s" x="540" y="307">candidata</text><path class="arr" d="M460 100 H513"/><path class="arr" d="M460 290 H513"/><rect class="decision" x="770" y="135" width="145" height="90"/><text class="h" x="790" y="170">Selección</text><text class="s" x="790" y="197">explícita</text><path class="arr" d="M710 100 H740 V160 H763"/><path class="arr" d="M710 290 H740 V200 H763"/><rect class="box" x="950" y="135" width="125" height="90"/><text class="h" x="965" y="170">Capa</text><text class="h" x="965" y="193">editable</text><text class="s" x="965" y="215">versionada</text><path class="arr" d="M915 180 H943"/></svg>