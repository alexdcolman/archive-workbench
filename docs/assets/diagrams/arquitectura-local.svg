<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">Arquitectura local de Archive Workbench</title><desc id="desc">La interfaz y CLI usan servicios de dominio que escriben en SQLite; los originales permanecen en archivos locales y los índices y derivados son reconstruibles.</desc><style>text{font-family:Arial,sans-serif;fill:#20211f}.box{fill:#fbf9f3;stroke:#244b5a;stroke-width:2}.core{fill:#f4f0e6;stroke:#6d2f2f;stroke-width:3}.arr{stroke:#64635d;stroke-width:2.5;fill:none;marker-end:url(#m)}.h{font-size:20px;font-weight:700}.s{font-size:15px}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64635d"/></marker></defs><rect class="box" x="30" y="40" width="230" height="90"/><text class="h" x="50" y="75">Interfaz Streamlit</text><text class="s" x="50" y="104">tareas de revisión</text><rect class="box" x="30" y="190" width="230" height="90"/><text class="h" x="50" y="225">CLI</text><text class="s" x="50" y="254">operaciones reproducibles</text><rect class="core" x="350" y="110" width="260" height="120"/><text class="h" x="375" y="150">Servicios de dominio</text><text class="s" x="375" y="180">catálogo · OCR · revisión</text><text class="s" x="375" y="205">búsqueda · intercambio · exportación</text><path class="arr" d="M260 85 H315 V145 H343"/><path class="arr" d="M260 235 H315 V195 H343"/><rect class="box" x="700" y="35" width="190" height="90"/><text class="h" x="720" y="70">SQLite</text><text class="s" x="720" y="99">fuente canónica</text><rect class="box" x="700" y="165" width="190" height="90"/><text class="h" x="720" y="200">Originales</text><text class="s" x="720" y="229">archivos inmutables</text><rect class="box" x="700" y="295" width="190" height="90"/><text class="h" x="720" y="330">Reconstruibles</text><text class="s" x="720" y="359">índices + derivados</text><path class="arr" d="M610 145 H655 V80 H693"/><path class="arr" d="M610 170 H693"/><path class="arr" d="M610 195 H655 V340 H693"/><rect class="box" x="945" y="105" width="145" height="110"/><text class="h" x="965" y="140">Paquetes</text><text class="s" x="965" y="168">exportación</text><text class="s" x="965" y="192">intercambio</text><path class="arr" d="M890 80 H915 V130 H938"/><path class="arr" d="M890 210 H915 V185 H938"/></svg>