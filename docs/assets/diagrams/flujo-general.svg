<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Recorrido general de Archive Workbench</title><desc id="desc">Flujo desde catálogo e incorporación hasta procesamiento, revisión, análisis, exportación, intercambio y resguardo.</desc><style>text{font-family:Arial,sans-serif;fill:#20211f}.box{fill:#fbf9f3;stroke:#6d2f2f;stroke-width:2}.arr{stroke:#244b5a;stroke-width:3;fill:none;marker-end:url(#m)}.small{font-size:16px}.head{font-size:20px;font-weight:700}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244b5a"/></marker></defs>
<rect class="box" x="25" y="45" width="200" height="95"/><text class="head" x="45" y="78">Catálogo</text><text class="small" x="45" y="106">unidades + originales</text>
<rect class="box" x="275" y="45" width="200" height="95"/><text class="head" x="295" y="78">Procesamiento</text><text class="small" x="295" y="106">derivados + OCR</text>
<rect class="box" x="525" y="45" width="200" height="95"/><text class="head" x="545" y="78">Revisión</text><text class="small" x="545" y="106">texto + decisiones</text>
<rect class="box" x="775" y="45" width="200" height="95"/><text class="head" x="795" y="78">Análisis</text><text class="small" x="795" y="106">búsqueda + entidades</text>
<rect class="box" x="1000" y="45" width="175" height="95"/><text class="head" x="1020" y="78">Exportación</text><text class="small" x="1020" y="106">CSV / JSONL / ZIP</text>
<path class="arr" d="M225 92 H268"/><path class="arr" d="M475 92 H518"/><path class="arr" d="M725 92 H768"/><path class="arr" d="M975 92 H993"/>
<rect class="box" x="300" y="255" width="240" height="95"/><text class="head" x="320" y="288">Intercambio</text><text class="small" x="320" y="316">copias locales + paquetes</text>
<rect class="box" x="660" y="255" width="240" height="95"/><text class="head" x="680" y="288">Resguardo</text><text class="small" x="680" y="316">integridad + backups</text>
<path class="arr" d="M625 140 V205 H420 V248"/><path class="arr" d="M1100 140 V205 H780 V248"/>
<text class="small" x="35" y="405">Los originales permanecen inmutables. Las extracciones y propuestas automáticas son candidatas hasta una decisión explícita.</text></svg>