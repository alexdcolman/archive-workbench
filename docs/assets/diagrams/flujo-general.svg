<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1690 520" role="img" aria-labelledby="title desc">
<title id="title">Recorrido general de Archive Workbench</title>
<desc id="desc">Cinco fases: preparar el corpus, organizar y revisar, explorar y describir, preparar resultados, y compartir y preservar.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#20211f}.phase{fill:#fbf9f3;stroke:#6d2f2f;stroke-width:2.5}.arr{stroke:#244b5a;stroke-width:3;fill:none;marker-end:url(#arrow)}.n{font-size:18px;font-weight:700;fill:#6d2f2f}.head{font-size:25px;font-weight:700}.item{font-size:18px}.note{font-size:16px;fill:#64635d}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244b5a"/></marker></defs>

<rect class="phase" x="35" y="70" width="280" height="285"/>
<text class="n" x="60" y="105">1</text><text class="head" x="88" y="105">Preparar el corpus</text>
<text class="item" x="60" y="155">Catálogo</text>
<text class="item" x="60" y="198">Audio y video</text>
<text class="item" x="60" y="241">Procesar documentos</text>
<text class="note" x="60" y="292">Unidades, archivos, imágenes,</text>
<text class="note" x="60" y="318">transcripciones y extracciones.</text>

<rect class="phase" x="365" y="70" width="280" height="285"/>
<text class="n" x="390" y="105">2</text><text class="head" x="418" y="105">Organizar y revisar</text>
<text class="item" x="390" y="170">Organizar trabajo</text>
<text class="item" x="390" y="213">Revisar documentos</text>
<text class="note" x="390" y="272">Asignaciones, correcciones,</text>
<text class="note" x="390" y="298">estructura e historial.</text>

<rect class="phase" x="695" y="45" width="390" height="335"/>
<text class="n" x="720" y="82">3</text><text class="head" x="748" y="82">Explorar y describir</text>
<text class="item" x="720" y="137">Búsqueda textual</text>
<text class="item" x="720" y="180">Búsqueda semántica</text>
<text class="item" x="720" y="223">Entidades y menciones</text>
<text class="item" x="720" y="266">Explorar relaciones</text>
<text class="note" x="720" y="326">Consultas, referentes y conexiones</text>
<text class="note" x="720" y="352">con procedencia revisable.</text>

<rect class="phase" x="1135" y="70" width="220" height="285"/>
<text class="n" x="1160" y="105">4</text><text class="head" x="1188" y="105">Preparar</text>
<text class="head" x="1188" y="135">resultados</text>
<text class="item" x="1160" y="190">Exportar corpus</text>
<text class="note" x="1160" y="244">Datos, texto</text>
<text class="note" x="1160" y="270">e imágenes.</text>

<rect class="phase" x="1405" y="45" width="250" height="335"/>
<text class="n" x="1430" y="82">5</text><text class="head" x="1458" y="82">Compartir</text>
<text class="head" x="1458" y="112">y preservar</text>
<text class="item" x="1430" y="170">Intercambiar cambios</text>
<text class="item" x="1430" y="225">Administrar y recuperar</text>
<text class="note" x="1430" y="292">Paquetes, integridad y</text>
<text class="note" x="1430" y="318">copias de seguridad.</text>

<path class="arr" d="M315 212 H355"/>
<path class="arr" d="M645 212 H685"/>
<path class="arr" d="M1085 212 H1125"/>
<path class="arr" d="M1355 212 H1395"/>

<text class="note" x="35" y="460">El diagrama resume un recorrido de trabajo. Las secciones pueden usarse en otro orden según el material y la tarea.</text>
</svg>
