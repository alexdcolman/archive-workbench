<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Intercambio entre copias</title><desc id="desc">Dos copias locales del mismo proyecto intercambian paquetes ZIP; cada persona conserva su SQLite y revisa los cambios antes de aplicarlos.</desc><style>text{font-family:Arial,sans-serif;fill:#20211f}.box{fill:#fbf9f3;stroke:#244b5a;stroke-width:2}.pkg{fill:#f4f0e6;stroke:#6d2f2f;stroke-width:3}.arr{stroke:#64635d;stroke-width:2.5;fill:none;marker-end:url(#m)}.h{font-size:20px;font-weight:700}.s{font-size:15px}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64635d"/></marker></defs><rect class="box" x="45" y="80" width="240" height="160"/><text class="h" x="70" y="120">Copia local A</text><text class="s" x="70" y="150">SQLite propia</text><text class="s" x="70" y="178">originales + decisiones</text><text class="s" x="70" y="206">historial local</text><rect class="pkg" x="430" y="105" width="240" height="110"/><text class="h" x="455" y="145">Paquete ZIP</text><text class="s" x="455" y="174">manifiesto + cambios</text><text class="s" x="455" y="198">inspección antes de aplicar</text><rect class="box" x="815" y="80" width="240" height="160"/><text class="h" x="840" y="120">Copia local B</text><text class="s" x="840" y="150">SQLite propia</text><text class="s" x="840" y="178">originales + decisiones</text><text class="s" x="840" y="206">historial local</text><path class="arr" d="M285 130 H423"/><path class="arr" d="M670 130 H808"/><path class="arr" d="M815 205 H677"/><path class="arr" d="M430 205 H292"/><text class="s" x="340" y="305">Google Drive puede transportar el ZIP, pero nunca sincroniza la base SQLite viva.</text></svg>