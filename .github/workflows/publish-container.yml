name: Publish Archive Workbench container images

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-cpu:
    name: CPU - linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read CPU image tag
        id: cpu-version
        shell: bash
        run: echo "tag=$(cat docker/image-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Build and publish CPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.cpu-version.outputs.tag }}
          cache-from: type=gha,scope=archive-workbench-cpu
          cache-to: type=gha,mode=max,scope=archive-workbench-cpu

  publish-gpu:
    name: NVIDIA GPU - linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read GPU image tag
        id: gpu-version
        shell: bash
        run: echo "tag=$(cat docker/gpu-image-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Build and publish GPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.gpu-version.outputs.tag }}
          cache-from: type=gha,scope=archive-workbench-gpu
          cache-to: type=gha,mode=max,scope=archive-workbench-gpu
