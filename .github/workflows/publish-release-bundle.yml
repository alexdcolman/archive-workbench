name: Publish Archive Workbench download bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release existente al que adjuntar el ZIP (por ejemplo, v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-download:
    name: Downloadable ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build managed download bundle
        shell: bash
        run: |
          python scripts/build_managed_release_bundle.py \
            --release-tag "${{ steps.release.outputs.tag }}" \
            --output-dir release-assets

      - name: Upload bundle to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            release-assets/Archive-Workbench.zip \
            release-assets/Archive-Workbench.zip.sha256 \
            --clobber
