name: Finalize stable 1.0.0 metadata

on:
  push:
    branches: [stable-1.0.0-prep]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v6
        with:
          ref: stable-1.0.0-prep

      - name: Apply transparent release-only edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          stable = '''## 1.0.0 - versión estable - 2026-09-09

          - Publica la primera versión estable de Archive Workbench a partir de la candidata `1.0.0 RC1`, sin cambios funcionales ni de esquema de base de datos.
          - Mantiene la revisión SQLite `0047_authority_relation_profiles` y los 30 contratos públicos congelados en RC1.
          - Actualiza los identificadores de distribución a `1.0.0`, `1.0.0-cpu` y `1.0.0-gpu`.
          - Conserva como cerrados los gates y recorridos materiales del pre-release; el corte estable sólo actualiza metadatos, documentación, empaquetado y distribución.

          '''
          if not text.startswith('## 1.0.0 - versión estable - 2026-09-09'):
              changelog.write_text(stable + text, encoding='utf-8')

          manifest_path = Path('scripts/candidate_update_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['candidate'] = '1.0.0 estable 2026-09-09'
          hashes = {
              '.assistant/project_docs/HISTORIAL_DE_CAMBIOS.md': '309fbfb433d40875c6e776926789da2ce75d726d5a2db20273306898eb8f9321',
              '.assistant/project_docs/operativos/ACTUALIZACION_ACTUAL.md': '68785ebd892fab531b5850a8c274ea90046f244bb9519f6831aa9b6cf5a923c9',
              '.assistant/project_docs/operativos/ESTRATEGIA_DE_PRUEBAS.md': '0fb35b07ab478c229f9a4c910f283df038ac833259c98e5d1bfcc83eeb5102c5',
              '.assistant/project_docs/operativos/HOJA_DE_RUTA_PRE_RELEASE.md': '08722d1a5c6d916faf6bc1aa3268f8ca9ca3d6ee87fa7a9ec3bb6e5d3b0f9108',
              '.assistant/project_docs/operativos/IMPLEMENTACIONES_REALIZADAS.md': '606e2a5b844713b3a9a71ab40745126acafcf01ce827dea9c0a55f1bf777a52d',
              '.assistant/project_docs/operativos/PENDIENTES_ACTIVOS.md': '1c0fed41ad543e0f7368e9f4030fb599e26899c3cce34c83186c65ee4957b0ba',
          }
          seen = set()
          for item in manifest['relocations']:
              target = item['to']
              if target in hashes:
                  item['to_sha256'] = hashes[target]
                  seen.add(target)
          if seen != set(hashes):
              raise SystemExit(f'Manifest targets missing: {sorted(set(hashes) - seen)}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ui_path = Path('tests/test_ui_navigation.py')
          ui = ui_path.read_text(encoding='utf-8')
          start = '    interaction = (assistant / "01_INTERACCION_Y_GUIADO.md").read_text(encoding="utf-8")\n'
          end = '    assert "SaaS genérico" in design_policy\n'
          if start in ui:
              before, rest = ui.split(start, 1)
              if end not in rest:
                  raise SystemExit('Could not find end of obsolete documentation-fragment assertions')
              _, after = rest.split(end, 1)
              replacement = '''    for name in (\n        "00_LEER_PRIMERO.md",\n        "01_INTERACCION_Y_GUIADO.md",\n        "05_CRITERIOS_INTERFAZ.md",\n        "POLITICA_SITIO_PUBLICO.md",\n        "LINEAMIENTOS_DE_DISENO_Y_ESCRITURA.md",\n    ):\n        assert (assistant / name).is_file()\n'''
              ui_path.write_text(before + replacement + after, encoding='utf-8')
          elif '        assert (assistant / name).is_file()' not in ui:
              raise SystemExit('Neither obsolete nor replacement UI test block was found')
          PY

      - name: Verify intended release edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          assert Path('CHANGELOG.md').read_text(encoding='utf-8').startswith('## 1.0.0 - versión estable - 2026-09-09')
          manifest = json.loads(Path('scripts/candidate_update_manifest.json').read_text(encoding='utf-8'))
          assert manifest['candidate'] == '1.0.0 estable 2026-09-09'
          ui = Path('tests/test_ui_navigation.py').read_text(encoding='utf-8')
          assert 'ruta completa dentro de la interfaz' not in ui
          assert 'SaaS genérico' not in ui
          PY

      - name: Commit final edits and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-stable-1.0.0.yml
          git add CHANGELOG.md scripts/candidate_update_manifest.json tests/test_ui_navigation.py
          git commit -m "Finalize Archive Workbench 1.0.0 preparation"
          git push origin HEAD:stable-1.0.0-prep
