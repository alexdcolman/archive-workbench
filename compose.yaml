name: archive-workbench

x-managed-environment: &managed-environment
  ARCHIVE_WORKBENCH_WORKSPACE_ROOT: /workspace
  ARCHIVE_WORKBENCH_PROJECTS_ROOT: /workspace/Projects
  ARCHIVE_WORKBENCH_DOCUMENT_IMPORT_ROOT: /workspace/Imports/Documents
  ARCHIVE_WORKBENCH_AUDIOVISUAL_IMPORT_ROOT: /workspace/Imports/AudioVideo
  ARCHIVE_WORKBENCH_PREFERENCES_PATH: /workspace/Settings/preferences.json
  ARCHIVE_WORKBENCH_SETTINGS_ROOT: /workspace/Settings
  ARCHIVE_WORKBENCH_PUBLIC_URL: "http://127.0.0.1:${AW_HOST_PORT:-8501}"
  ARCHIVE_WORKBENCH_SELECTED_PROJECT_ROOT: "${AW_SELECTED_PROJECT_CONTAINER:-}"
  HF_HOME: /workspace/Settings/huggingface
  TORCH_HOME: /workspace/Settings/torch
  XDG_CACHE_HOME: /workspace/Settings/cache
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "1024"
  ARCHIVE_WORKBENCH_SURYA_BACKEND: llamacpp

x-app-common: &app-common
  init: true
  user: "${AW_UID:-1000}:${AW_GID:-1000}"
  ports:
    - "127.0.0.1:${AW_HOST_PORT:-8501}:8501"
  volumes:
    - type: bind
      source: ./ArchiveWorkbenchData
      target: /workspace
    - type: bind
      source: "${AW_SELECTED_PROJECT_HOST:-./ArchiveWorkbenchData/Projects}"
      target: /selected-project
  shm_size: "2gb"
  restart: "no"

services:
  app-cpu:
    <<: *app-common
    image: ${ARCHIVE_WORKBENCH_CPU_IMAGE:-ghcr.io/alexdcolman/archive-workbench:0.89.0-rc83-cpu}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    profiles: ["cpu"]
    environment:
      <<: *managed-environment
      ARCHIVE_WORKBENCH_RUNTIME_VARIANT: cpu

  app-gpu:
    <<: *app-common
    image: ${ARCHIVE_WORKBENCH_GPU_IMAGE:-ghcr.io/alexdcolman/archive-workbench:0.89.0-rc83-gpu}
    build:
      context: .
      dockerfile: Dockerfile.gpu
    pull_policy: missing
    profiles: ["gpu"]
    gpus: all
    environment:
      <<: *managed-environment
      ARCHIVE_WORKBENCH_RUNTIME_VARIANT: gpu
