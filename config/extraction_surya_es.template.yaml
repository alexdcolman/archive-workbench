schema_version: "1.0"
profile_key: "surya_ocr_layout_es_preferred_v2"
backend: "surya_cli"
surya_command: ".venv-surya/bin/surya_ocr"
surya_inference_url: null
surya_parallel: 1
surya_keep_server: true
surya_torch_device: "cpu"
surya_clean_library_path: true
fallback_profile: "config/extraction_docling_es.yaml"
ocr_languages: ["spa"]
psm: null
device: "auto"
fallback_device: "cpu"
retry_on_accelerator_error: true
document_timeout_seconds: 1800
use_ocr_derivatives: true
minimum_characters_per_page_warning: 40
image_variant: "original"
object_granularity: "paragraph"
layout_hint: "automatic"
