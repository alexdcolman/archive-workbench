schema_version: "1.0"
profile_key: docling_tesseract_es_v1
backend: docling_cli
docling_command: docling
tesseract_command: tesseract
pipeline: standard
ocr_engine: tesseract
ocr_languages: [spa]
force_ocr: true
extract_tables: true
table_mode: accurate
psm: 3
device: auto
fallback_device: cpu
retry_on_accelerator_error: true
num_threads: 4
page_batch_size: 1
document_timeout_seconds: 900
use_ocr_derivatives: true
image_export_mode: placeholder
minimum_characters_per_page_warning: 20
artifacts_path: null
