project_name: "Archivo de servicios de inteligencia policial"
project_id: "archivo_inteligencia"

archival_levels:
  - key: archivo
    label: Archivo
    plural_label: Archivos
    display_order: 0
    parent_keys: []
    required_fields: [title]
    optional: true

  - key: fondo
    label: Fondo
    plural_label: Fondos
    display_order: 1
    parent_keys: [archivo]
    required_fields: [title]
    optional: false

  - key: seccion
    label: Sección
    plural_label: Secciones
    display_order: 2
    parent_keys: [fondo]
    required_fields: [title]
    optional: false

  - key: subseccion
    label: Subsección
    plural_label: Subsecciones
    display_order: 3
    parent_keys: [seccion]
    required_fields: [title]
    optional: true

  - key: serie
    label: Serie
    plural_label: Series
    display_order: 4
    parent_keys: [seccion, subseccion]
    required_fields: [title]
    optional: false

  - key: subserie
    label: Subserie
    plural_label: Subseries
    display_order: 5
    parent_keys: [serie]
    required_fields: [title]
    optional: true

  - key: caja
    label: Caja
    plural_label: Cajas
    display_order: 6
    parent_keys: [serie, subserie]
    required_fields: [title]
    optional: true

  - key: legajo
    label: Legajo
    plural_label: Legajos
    display_order: 7
    parent_keys: [serie, subserie, caja]
    required_fields: [title]
    optional: false

  - key: tomo
    label: Tomo
    plural_label: Tomos
    display_order: 8
    parent_keys: [legajo]
    required_fields: [title]
    optional: true

  - key: documento
    label: Documento
    plural_label: Documentos
    display_order: 9
    parent_keys: [legajo, tomo]
    required_fields: [title]
    optional: true

object_types:
  - {key: title, label: Título, category: structure, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: true}
  - {key: section_heading, label: Encabezado de sección, category: structure, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: true}
  - {key: paragraph, label: Párrafo, category: text, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}
  - {key: list_item, label: Ítem de lista, category: text, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}
  - {key: table, label: Tabla, category: visual, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}
  - {key: figure, label: Figura o imagen, category: visual, visible_by_default: true, editable: false, searchable: false, export_by_default: false, can_have_children: false}
  - {key: chart, label: Gráfico, category: visual, visible_by_default: true, editable: false, searchable: false, export_by_default: false, can_have_children: false}
  - {key: caption, label: Epígrafe, category: paratext, visible_by_default: true, editable: true, searchable: true, export_by_default: false, can_have_children: false}
  - {key: footnote, label: Nota al pie, category: paratext, visible_by_default: false, editable: true, searchable: true, export_by_default: false, can_have_children: false}
  - {key: table_of_contents, label: Índice, category: structure, visible_by_default: false, editable: true, searchable: true, export_by_default: false, can_have_children: true}
  - {key: page_header, label: Encabezado de página, category: paratext, visible_by_default: false, editable: true, searchable: false, export_by_default: false, can_have_children: false}
  - {key: page_footer, label: Pie de página, category: paratext, visible_by_default: false, editable: true, searchable: false, export_by_default: false, can_have_children: false}
  - {key: stamp, label: Sello, category: visual, visible_by_default: true, editable: true, searchable: true, export_by_default: false, can_have_children: false}
  - {key: handwritten_region, label: Anotación manuscrita, category: visual, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}
  - {key: marginalia, label: Anotación marginal, category: paratext, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}
  - {key: form_field, label: Campo de formulario o ficha, category: text, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}
  - {key: unknown, label: Objeto sin clasificar, category: other, visible_by_default: true, editable: true, searchable: true, export_by_default: true, can_have_children: false}

jsonl:
  schema_version: "1.0"
  objects_filename: objects.jsonl
  paragraphs_filename: paragraphs.jsonl
  images_filename: images.jsonl
  manifest_filename: manifest.json
  image_storage: referenced
  coordinate_space: normalized

identity:
  entity_ids: uuid4
  digital_object_identity: sha256
  preserve_original_filename: true
  paths_are_identity: false
  extraction_identity_fields: [digital_object_id, source_sha256, engine, options_hash]
  text_object_ids_survive_reordering: true
  split_merge_use_lineage: true

merge:
  additive_entity_types: [annotation, tag_assignment, entity_mention, relation]
  exclusive_fields:
    archival_unit: [parent_id, level_key, reference_code, title]
    text_object: [edited_text, object_type, part_id, superseded_by]
    extraction_run: [is_current]
  allow_disjoint_field_merge: true
  conflict_requires_admin_confirmation: true
  delete_vs_update_is_conflict: true

tiff:
  preserve_original: true
  accept_single_page: true
  accept_multipage: true
  split_multipage_for_processing: true
  ocr_derivative_format: png
  preview_format: webp
  target_ocr_dpi: 300
  preview_dpi: 150
  use_pyvips_when_available: true
  never_overwrite_source: true
